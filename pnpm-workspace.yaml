packages:
  - "desktop"

# electron-builder 26 pulls @electron/rebuild 3.7, which depends on a git
# tarball of @electron/node-gyp. Rebuild 4.x is registry-clean but breaks
# app-builder-lib's ./lib/search-module import.
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.85'
  - '@ai-sdk/provider-utils@5.0.43'
  - '@ai-sdk/provider@4.0.17'
  - ai@7.0.105
  - eve@0.59.0

allowBuilds:
  sharp: false
  electron: true
